name: Manifest Updater

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'packs/**'
  push:
    branches:
      - main
    paths:
      - 'packs/**'

jobs:
  process-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted project sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      
      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      - name: Process PR Comments and Labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew process-pr-comments -PPR_NUMBER=${{ github.event.pull_request.number }} -PREPO_NAME=${{ github.repository }}
  
  update-manifest:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout project sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      - name: Get changed pack file
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            CHANGED_FILE=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep '^packs/' | head -n 1)
            if [ -n "$CHANGED_FILE" ]; then
              PACK_FILE=$(basename "$CHANGED_FILE")
              echo "packFile=$PACK_FILE" >> $GITHUB_OUTPUT
              echo "Found changed pack file: $PACK_FILE"
            else
              echo "No pack file changed, processing all packs"
            fi
          fi
      
      - name: Update Manifest${{ steps.changed-files.outputs.packFile && ' [' || '' }}${{ steps.changed-files.outputs.packFile }}${{ steps.changed-files.outputs.packFile && ']' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ steps.changed-files.outputs.packFile }}" ]; then
            ./gradlew update-manifest -PpackFile="${{ steps.changed-files.outputs.packFile }}"
          else
            ./gradlew update-manifest
          fi
