name: Block Pull Requests

# Lives only on the manifest branch: pull_request_target resolves its workflow
# file from the PR's base branch, so this only ever runs for PRs targeting
# manifest. manifest.json is published here only by the update-manifest job
# on main (via the GitHub API) and never accepts pull requests.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Close and explain
        run: |
          gh pr comment "$PR_NUMBER" --body "The \`manifest\` branch is generated and published automatically by CI and does not accept pull requests. If you're submitting a resource pack, open your PR against \`main\` instead. Closing this PR automatically."
          gh pr close "$PR_NUMBER"
